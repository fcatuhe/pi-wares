version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # one PR for all minor/patch bumps, majors stay separate for review
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  # keeps actions in future workflows pinned and current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: infra

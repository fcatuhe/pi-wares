name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # bang-zsh's self-check runs its escaping through a real zsh, which the runner image lacks
      - run: sudo apt-get install -y --no-install-recommends zsh
      # catches broken lockfiles and yanked packages in dependabot PRs
      - run: npm ci
      # the wares' self-checks; tsx erases types, so the @earendil-works peers are not needed
      - run: npm test

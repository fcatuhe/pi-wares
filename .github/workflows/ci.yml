name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # no lockfile in the repo (gitignored), so install resolves ranges fresh;
      # catches yanked packages and unresolvable ranges in dependabot PRs
      - run: npm install
